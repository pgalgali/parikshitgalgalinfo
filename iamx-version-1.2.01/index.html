<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parikshit Gururaj Galgali - CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f8fafc;
      font-family: 'Inter', sans-serif;
      margin: 0;
      color: #22223b;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      box-shadow: 0 2px 12px #e2e8f0;
      border-radius: 22px;
      padding: 40px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }
    .sidebar {
      flex: 0 0 270px;
      margin-right: 32px;
    }
    .sidebar h2 {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .sidebar .contact, .sidebar .skills, .sidebar .certs, .sidebar .affiliations {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 20px 20px 12px 20px;
      margin-bottom: 16px;
    }
    .sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      line-height: 1.8;
    }
    .main {
      flex: 1;
      min-width: 280px;
      margin-top: 12px;
    }
    .main .section {
      background: #f9fafb;
      border-radius: 14px;
      padding: 28px 24px 20px 24px;
      margin-bottom: 28px;
      box-shadow: 0 1px 3px #e9e9ef33;
    }
    h3 {
      margin: 0 0 10px 0;
      color: #283593;
      font-size: 1.18rem;
    }
    /* Timeline styles (vertical) */
    .timeline {
      position: relative;
      margin-left: 0px;
      padding-left: 36px;
      border-left: 3.5px solid #6c63ff;
    }
    .timeline-entry {
      margin-bottom: 40px;
      position: relative;
    }
    .timeline-entry:before {
      content: '';
      position: absolute;
      left: -21px;
      top: 4px;
      width: 16px;
      height: 16px;
      background: #fff;
      border: 4px solid #6c63ff;
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 2px 4px #6c63ff21;
    }
    .timeline-entry:last-child { margin-bottom: 0; }
    .timeline-date {
      color: #6166b3;
      font-size: 1em;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .timeline-header {
      margin-bottom: 4px;
      font-size: 1.08em;
      font-weight: 700;
    }
    .timeline-content {
      margin-left: 1px;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    @media (max-width: 850px) {
      .container { flex-direction: column; padding: 24px 4vw;}
      .sidebar { margin-right: 0; }
    }
    a { color: #2637ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
